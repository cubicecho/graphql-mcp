name: Test

on:
  push:

jobs:
  test:
    name: test (zod ${{ matrix.zod }}, graphql ${{ matrix.graphql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # zod is a peer dependency spanning two majors, and the two differ in
        # their type names and error wording. Both have to pass, so the suite
        # runs once per major rather than only against whatever the lockfile
        # happens to pin.
        zod: ['^3.25', '^4.0']
        # graphql spans two majors for the same reason, and v17 is what `npm i
        # graphql` now installs — so the untested leg was the one a new consumer
        # gets by default. `toArgument` (src/operations.ts) hand-builds a
        # `GraphQLArgument` with a synthetic `astNode`, and v17 reworks
        # `defaultValue` on input values, so this leg is what says when that
        # construction needs adapting.
        graphql: ['^16', '^17']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Install zod ${{ matrix.zod }} / graphql ${{ matrix.graphql }}
        run: npm install --no-save "zod@${{ matrix.zod }}" "graphql@${{ matrix.graphql }}"

      - name: Lint
        run: npx biome check .

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npm run typecheck:tests

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build

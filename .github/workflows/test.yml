name: Test

on:
  push:

jobs:
  test:
    name: test (zod ${{ matrix.zod }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # zod is a peer dependency spanning two majors, and the two differ in
        # their type names and error wording. Both have to pass, so the suite
        # runs once per major rather than only against whatever the lockfile
        # happens to pin.
        zod: ['^3.25', '^4.0']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Install zod ${{ matrix.zod }}
        run: npm install --no-save "zod@${{ matrix.zod }}"

      - name: Lint
        run: npx biome check .

      - name: Type check
        run: npm run typecheck

      - name: Type check tests
        run: npm run typecheck:tests

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run coverage

      - name: Build
        run: npm run build
